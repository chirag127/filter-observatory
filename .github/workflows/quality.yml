name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  megalinter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check all maintained languages
        uses: oxsecurity/megalinter@f2fe8c1cba37091848df3e524066c8c23ef353ed # v10.2.0
        env:
          APPLY_FIXES: none
      - name: Preserve lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megalinter-reports
          path: megalinter-reports
          if-no-files-found: warn
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            companion/package-lock.json
      - run: npm ci
      - run: npm --prefix companion ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm --prefix companion test
      - run: npm --prefix companion run compile
      - run: npm --prefix companion run build
      - run: npm --prefix companion run build:firefox
